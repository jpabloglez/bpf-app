name: bp_tracker
description: Private, offline blood pressure and heart rate tracker.
publish_to: 'none'

# versionName+versionCode. Bump the build number (after +) for every upload
# to the Play Store; it must always increase.
version: 1.1.0+2

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter

  # Database
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  path: ^1.9.0

  # Charts
  fl_chart: ^1.1.0

  # PDF
  pdf: ^3.11.3
  printing: ^5.14.2

  # Utilities
  intl: ^0.20.2

  # State Management
  provider: ^6.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.6

flutter:
  uses-material-design: true
